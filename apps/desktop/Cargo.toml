[package]
name = "span-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "span-desktop"
autobins = false

[features]
dev-tools = []

[[bin]]
name = "span-desktop"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "tools/export-bindings.rs"
required-features = ["dev-tools"]

[lib]
name = "span_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
embed-resource = "=3.0.12"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
base64 = "0.22"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "0.0.13"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio.workspace = true
span-core.workspace = true
span-syntax.workspace = true
span-acp.workspace = true

[dev-dependencies]
tempfile = "3"

[package]
name = "span-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "span-desktop"
autobins = false

[features]
dev-tools = []
# Real-server tests download and run the pinned language servers (network, Node, a JDK 25+).
# CI runs them in a dedicated Linux job: `cargo test -p span-desktop --features real-servers`.
real-servers = []

[[bin]]
name = "span-desktop"
path = "src/main.rs"

[[test]]
name = "real_servers"
required-features = ["real-servers"]

[[bin]]
name = "export-bindings"
path = "tools/export-bindings.rs"
required-features = ["dev-tools"]

[lib]
name = "span_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
embed-resource = "=3.0.12"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
# File lists and images on the OS clipboard. Already built by the clipboard manager plugin.
arboard = "3.7"
# Encodes a pasted clipboard image. Already in the dependency graph.
png = "0.18"
base64 = "0.22"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "0.0.13"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio.workspace = true
span-core.workspace = true
span-syntax.workspace = true
span-acp.workspace = true
span-terminal.workspace = true
span-file-index.workspace = true
notify = "8.2.1"
ignore = "0.4"
span-lsp.workspace = true
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.12.5", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[workspace]
members = ["crates/core", "crates/syntax", "crates/acp", "crates/terminal", "apps/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
ropey = "1.6.1"
tree-sitter = "0.27.1"
span-core = { path = "crates/core" }
span-syntax = { path = "crates/syntax" }
span-acp = { path = "crates/acp" }
span-terminal = { path = "crates/terminal" }

# Keep local development and validation caches small enough for desktop builds.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

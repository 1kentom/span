[package]
name = "span-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
specta.workspace = true
thiserror.workspace = true
ropey.workspace = true
span-syntax.workspace = true
tokio.workspace = true
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
# Exact line diffs preserve independent, reviewable ACP write hunks.
similar = "=3.2.0"
dprint-plugin-json = "=0.25.2"
dprint-plugin-markdown = "=0.28.2"
dprint-plugin-typescript = "=0.96.1"
libc = "0.2"
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
unicode-normalization = "0.1"
unicode-casefold = "0.2"

[dev-dependencies]
tempfile = "3"

# Native recoverable deletion, never a permanent-delete fallback.
[dependencies.trash]
version = "=5.2.9"

# Native atomic no-replace rename avoids check-then-overwrite races.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[package]
name = "span-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
specta.workspace = true
thiserror.workspace = true
ropey.workspace = true
tokio.workspace = true
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
# Exact line diffs preserve independent, reviewable ACP write hunks.
similar = "=3.2.0"
# Archive viewing and safe extraction (docs/decisions/0007-archive-dependencies.md).
# Same versions span-lsp already locks; pure Rust, no encryption or time features.
zip = { version = "=2.6.1", default-features = false, features = ["deflate-flate2", "flate2"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"

# Native recoverable deletion, never a permanent-delete fallback.
[dependencies.trash]
version = "=5.2.9"

# Native atomic no-replace rename avoids check-then-overwrite races.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

name: Build release installers

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    if: github.repository == '1kentom/span'
    environment: release-${{ inputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require explicit environment phase approval before stable builds
        if: inputs.channel == 'stable'
        env:
          APPROVED: ${{ vars.PHASE_0_1_RELEASE_APPROVED }}
        run: test "$APPROVED" = true
      - name: Check out the exact CI-approved source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Stamp version into a temporary Tauri merge config
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: >-
          python scripts/release/release.py stamp --version "$RELEASE_VERSION"
          --channel "$RELEASE_CHANNEL" --output "$RUNNER_TEMP/span-release.json"
      - name: Prepare macOS code signing and notarization
        if: runner.os == 'macOS'
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/release/signing.py macos
      - name: Prepare Windows code signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/sign-windows.ps1
      - name: Build platform installer bundles
        working-directory: apps/desktop
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BUNDLES: ${{ matrix.bundles }}
        run: pnpm exec tauri build --target "$RELEASE_TARGET" --bundles "$RELEASE_BUNDLES" --config "$RUNNER_TEMP/span-release.json"
      - name: Collect installers with architecture-qualified names
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: >-
          python scripts/release/release.py collect
          --source "target/$RELEASE_TARGET/release/bundle"
          --target "$RELEASE_TARGET" --output release-installers
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: release-installers/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary macOS signing material
        if: always() && runner.os == 'macOS'
        run: python scripts/release/signing.py cleanup

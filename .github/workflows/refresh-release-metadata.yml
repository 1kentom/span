name: Refresh release metadata

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag
        required: true
        type: string
      channel:
        description: Channel of the existing published release
        required: true
        type: choice
        options: [nightly, preview, stable]

permissions:
  contents: read

concurrency:
  group: website-release-metadata
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == '1kentom/span' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-${{ inputs.channel }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test exact-tag manifest validation
        run: node --test apps/web/scripts/sync-releases.test.mjs
      - name: Refresh metadata for an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: bash scripts/release/update-website-manifest.sh
